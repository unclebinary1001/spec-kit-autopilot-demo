name: Spec Kit Autopilot

# Deterministically runs the REAL spec-kit commands
# (constitution -> specify -> clarify -> plan -> tasks -> implement) via
# `specify workflow run`, driven by the Copilot CLI, then opens a PR with the
# generated artifacts and implementation.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      item_number:
        description: "Issue number to process"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: speckit-${{ github.event.issue.number || inputs.item_number || github.run_id }}
  cancel-in-progress: false

jobs:
  speckit:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'auto-spec')
    runs-on: ubuntu-latest
    env:
      SPECIFY_INTEGRATION: copilot
    steps:
      - name: Check triggering user permissions
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const actor = context.actor;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });
            const allowed = ['admin', 'maintain', 'write'];
            if (!allowed.includes(perm.permission)) {
              core.setFailed(`User "${actor}" has permission "${perm.permission}" — write, maintain, or admin access is required to trigger this workflow.`);
            }

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Resolve issue context
        id: context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'issues') {
              issue = context.payload.issue;
            } else {
              const rawIssueNumber = context.payload.inputs?.item_number;
              const issueNumber = Number(rawIssueNumber);
              if (!Number.isFinite(issueNumber)) {
                core.setFailed(`workflow_dispatch input item_number must be numeric. Received: ${rawIssueNumber}`);
                return;
              }

              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issue = response.data;
            }

            if (!issue || issue.pull_request) {
              core.setFailed('This workflow only supports issues (not pull requests).');
              return;
            }

            const title = (issue.title || '').trim();
            const body = (issue.body || '').trim();
            const request = [title, body].filter(Boolean).join('\n\n');
            const requestCli = request.replace(/\s+/g, ' ').trim();

            core.setOutput('issue_number', String(issue.number));
            core.setOutput('issue_title', title);
            core.setOutput('issue_body', body);
            core.setOutput('spec_request', request || `Issue #${issue.number}`);
            core.setOutput('spec_request_cli', requestCli || `Issue #${issue.number}`);

      - name: Remove trigger label
        if: github.event_name == 'issues' && github.event.label.name == 'auto-spec'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'auto-spec',
            }).catch(() => {});

      - name: Add start comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = Number('${{ steps.context.outputs.issue_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                '🚀 Starting deterministic Spec Kit autopilot run.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: latest

      - name: Setup gh-aw scripts
        uses: github/gh-aw-actions/setup@20045bbd5ad2632b9809856c389708eab1bd16ef # v0.62.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions

      - name: Install GitHub Copilot CLI
        run: bash ${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh latest
        env:
          GH_HOST: github.com

      - name: Install Spec Kit CLI
        run: uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@v0.11.2"

      - name: Bootstrap Spec Kit
        run: specify init . --here --force --integration "$SPECIFY_INTEGRATION"

      - name: Diagnose Copilot token
        # Temporary diagnostic: determines whether the COPILOT_GITHUB_TOKEN that
        # CI actually sees can perform the Copilot token exchange the CLI relies
        # on. Prints token TYPE (prefix) and owning ACCOUNT — never the secret
        # (Actions masks it) and never the minted Copilot token (only HTTP code).
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "❌ COPILOT_GITHUB_TOKEN secret is EMPTY / not set."; exit 1
          fi
          echo "Token length: ${#COPILOT_GITHUB_TOKEN}"
          echo "Token type (prefix): ${COPILOT_GITHUB_TOKEN%%_*}_   (ghp_=classic PAT, github_pat_=fine-grained, gho_=OAuth, ghs_=app/Actions)"

          echo "--- Which account owns this token? ---"
          curl -s -H "Authorization: token ${COPILOT_GITHUB_TOKEN}" \
            https://api.github.com/user \
            | grep -E '"(login|type)"' || echo "(could not read /user)"

          echo "--- Copilot token exchange (what the CLI actually does) ---"
          code=$(curl -s -o /tmp/cop.json -w "%{http_code}" \
            -H "Authorization: token ${COPILOT_GITHUB_TOKEN}" \
            https://api.github.com/copilot_internal/v2/token)
          echo "copilot_internal/v2/token -> HTTP ${code}"
          if [ "${code}" = "200" ]; then
            echo "✅ Copilot token exchange SUCCEEDED — this token has Copilot access."
          else
            echo "❌ Copilot token exchange FAILED. Error body (no secret):"
            cat /tmp/cop.json; echo ""
          fi

      - name: Run real Spec Kit commands
        # Only the Copilot token is exposed here. The spec-kit commands
        # (constitution → implement) operate on local files and do NOT call the
        # GitHub API, so GITHUB_TOKEN is intentionally omitted — leaving it set
        # risks the Copilot CLI resolving the (Copilot-incapable) Actions token.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SPEC_REQUEST: ${{ steps.context.outputs.spec_request_cli }}
        run: |
          set -euo pipefail
          specify workflow run .github/spec-kit/autopilot-workflow.yml \
            --input "request=${SPEC_REQUEST}"

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[speckit] generate artifacts for #${{ steps.context.outputs.issue_number }}"
          branch: "speckit/issue-${{ steps.context.outputs.issue_number }}"
          base: ${{ github.event.repository.default_branch }}
          title: "[speckit] Spec Kit artifacts for #${{ steps.context.outputs.issue_number }}"
          body: |
            Generated by deterministic Spec Kit automation, running the **real** spec-kit commands.

            Executed steps:
            1. `specify init . --here --force --integration copilot`
            2. `specify workflow run .github/spec-kit/autopilot-workflow.yml`
               - `speckit.constitution`
               - `speckit.specify`
               - `speckit.clarify`
               - `speckit.plan`
               - `speckit.tasks`
               - `speckit.implement`

            Source issue: #${{ steps.context.outputs.issue_number }}
          labels: |
            speckit
            spec-artifacts

      - name: Report completion
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = Number('${{ steps.context.outputs.issue_number }}');
            if (!issue_number || issue_number <= 0) {
              core.warning('No valid issue_number resolved; skipping completion comment.');
              return;
            }
            const prUrl = '${{ steps.cpr.outputs.pull-request-url }}';
            const operation = '${{ steps.cpr.outputs.pull-request-operation }}';
            const result = '${{ job.status }}';

            let body = `✅ Spec Kit autopilot finished with status: **${result}**.`;
            if (prUrl) {
              body += `\n\nPR ${operation || 'updated'}: ${prUrl}`;
            } else {
              body += '\n\nNo pull request was created (no changes detected).';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
